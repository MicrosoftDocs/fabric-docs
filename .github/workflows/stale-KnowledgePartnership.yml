# Goals and actions:
# - Run only in MicrosoftDocs/fabric-docs-pr, never its public mirror or forks.
# - Add conference-event to Ignite PRs targeting release-ignite26-*.
# - Check hourly; after 3 days without PR activity, post a progress reminder
#   and add kp-author-stalepr.
# - New comments, commits, and other PR updates like label changes restart the three-day wait.
# - Skip drafts and kp-stale-exempt PRs; clean obsolete reminder markers.
# - Apply changes automatically; never close PRs.
#
# Knowledge Partnership flow in this PR (two independent entry points):
#
# 1. PR opened, reopened, edited, updated, or marked ready for review
#         |
#         v
#    Target branch starts with release-ignite26-?
#        NO --> No enrollment action
#        YES --> Validate required labels; add conference-event if missing
#         |
#         v
#    Stop: PR events never send reminders.
#
# 2. Hourly scheduled scan (minute 0 UTC); manual live runs are also available
#         |
#         v
#    Validate labels; backfill conference-event on matching open PRs
#         |
#         v
#    Labels-only selected? YES --> Stop after labeling
#         NO
#         |
#         v
#    Clean obsolete author reminder markers
#         |
#         v
#    Open, non-draft PR with conference-event, without kp-stale-exempt?
#        NO --> Skip reminder
#        YES --> No PR activity for at least 3 days?
#                    NO --> No reminder
#                    YES --> Already marked kp-author-stalepr?
#                                YES --> No repeat while still inactive
#                                NO --> Post progress reminder; add marker
#
# Scheduled and manual runs apply changes; no dry-run mode is provided.
# New activity clears the reminder marker on a later scan and restarts the wait.
# No author-action label is required. Another 3 inactive days can trigger a reminder.
# Reviewer automation is paused. This workflow never closes PRs.
name: KP - Stale PR

# Source of truth: supporting workflows receive these settings as inputs.
env:
  # Days without PR activity before a reminder.
  INACTIVITY_DAYS: "3"
  # Per reminder invocation, not a PR count or a fix for shared checkpoints.
  OPERATIONS_PER_RUN: "350"
  ROLLOUT_BRANCH_PREFIX: release-ignite26-
  EVENT_LABEL: conference-event
  AUTHOR_ACTION_LABEL: kp-author-addresscomments
  # Reviewer automation is paused until next-action ownership is agreed.
  # REVIEWER_ACTION_LABEL: kp-reviewer-inputneeded
  AUTHOR_REMINDER_LABEL: kp-author-stalepr
  # REVIEWER_REMINDER_LABEL: kp-reviewer-stalepr
  EXEMPT_LABEL: kp-stale-exempt

on:
  # PR events only validate and label matching PRs; they never send reminders.
  # Never check out or execute contributor code in this privileged workflow.
  # Check the configured prefix in the jobs rather than duplicating it here.
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited, synchronize]
  schedule:
    # Once per hour
    - cron: "0 * * * *"
  # Optional manual runs also apply changes; the hourly schedule needs no opt-in.
  workflow_dispatch:
    inputs:
      labels-only:
        description: Only validate and backfill event labels; skip cleanup and reminders
        type: boolean
        default: false
        required: true

# Read label definitions and allow the bot to update PR labels and comments.
permissions:
  # Allow the reusable reminder workflow to maintain actions/stale progress.
  actions: write
  issues: read
  pull-requests: write

# Serialize reminder runs; label-only PR events use separate per-PR groups.
# An active run finishes rather than being canceled by a newer run.
concurrency:
  group: knowledge-partnership-${{ github.event_name == 'pull_request_target' && format('label-pr-{0}', github.event.pull_request.number) || 'reminders' }}
  cancel-in-progress: false

jobs:
  # Reusable-workflow calls can't read the caller's env context directly.
  # Export the settings as job outputs so every call uses the values above.
  configuration:
    name: Share workflow settings
    if: github.repository == 'MicrosoftDocs/fabric-docs-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      inactivity-days: ${{ env.INACTIVITY_DAYS }}
      operations-per-run: ${{ env.OPERATIONS_PER_RUN }}
      rollout-branch-prefix: ${{ env.ROLLOUT_BRANCH_PREFIX }}
      event-label: ${{ env.EVENT_LABEL }}
      author-action-label: ${{ env.AUTHOR_ACTION_LABEL }}
      # reviewer-action-label: ${{ env.REVIEWER_ACTION_LABEL }}
      author-reminder-label: ${{ env.AUTHOR_REMINDER_LABEL }}
      # reviewer-reminder-label: ${{ env.REVIEWER_REMINDER_LABEL }}
      exempt-label: ${{ env.EXEMPT_LABEL }}
    steps:
      - name: Check shared settings
        shell: bash
        run: |
          for setting in INACTIVITY_DAYS OPERATIONS_PER_RUN ROLLOUT_BRANCH_PREFIX EVENT_LABEL AUTHOR_ACTION_LABEL \
                         AUTHOR_REMINDER_LABEL EXEMPT_LABEL; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Required setting '$setting' must not be empty."
              exit 1
            fi
          done
          if [[ ! "$INACTIVITY_DAYS" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::INACTIVITY_DAYS must be a nonnegative whole number."
            exit 1
          fi
          if [[ ! "$OPERATIONS_PER_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::OPERATIONS_PER_RUN must be a positive whole number."
            exit 1
          fi

  # Check that all manually created labels exist before labeling or reminders.
  # Ignore unrelated PR events; scheduled and manual runs always validate.
  validate-labels:
    name: Validate Knowledge Partnership labels
    needs: configuration
    if: >-
      github.repository == 'MicrosoftDocs/fabric-docs-pr' &&
      (github.event_name != 'pull_request_target' ||
      startsWith(github.event.pull_request.base.ref, needs.configuration.outputs.rollout-branch-prefix))
    uses: ./.github/workflows/reusable-kp-validate-labels.yml
    with:
      event-label: ${{ needs.configuration.outputs.event-label }}
      author-action-label: ${{ needs.configuration.outputs.author-action-label }}
      # reviewer-action-label: ${{ needs.configuration.outputs.reviewer-action-label }}
      author-reminder-label: ${{ needs.configuration.outputs.author-reminder-label }}
      # reviewer-reminder-label: ${{ needs.configuration.outputs.reviewer-reminder-label }}
      exempt-label: ${{ needs.configuration.outputs.exempt-label }}

  # Backfill event labels only after process-label validation succeeds.
  label-event-prs:
    name: Label rollout PRs
    needs: [configuration, validate-labels]
    if: github.repository == 'MicrosoftDocs/fabric-docs-pr'
    uses: ./.github/workflows/reusable-kp-label-event.yml
    with:
      event-label: ${{ needs.configuration.outputs.event-label }}
      rollout-branch-prefix: ${{ needs.configuration.outputs.rollout-branch-prefix }}

  # Run exemption handling and status cleanup after validation and labeling succeed.
  manage-pr-reminders:
    name: Manage Knowledge Partnership reminders
    needs: [configuration, validate-labels, label-event-prs]
    if: >-
      github.repository == 'MicrosoftDocs/fabric-docs-pr' &&
      github.event_name != 'pull_request_target' && !inputs.labels-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scheduled and manual runs perform cleanup; PR events skip this job.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      # 1. Exemption handling: check that the event label exists and log exclusions.
      # The supporting reminder workflow enforces these exclusions.
      - name: Validate event scope and exemption policy
        shell: bash
        run: |
          label_names=$(gh api --paginate "repos/$GH_REPO/labels?per_page=100" --jq '.[].name')
          if ! grep -Fxq -- "$EVENT_LABEL" <<< "$label_names"; then
            echo "::error::Required event label '$EVENT_LABEL' is missing. Create it and label rollout PRs before enabling reminders."
            exit 1
          fi
          echo "Reminder scope: $EVENT_LABEL"
          echo "Exemption: $EXEMPT_LABEL; drafts are also excluded."
          echo "Reviewer automation is paused; no next-action label is required."

      # 2. Status cleanup: remove reminder labels when a PR no longer qualifies.
      # Drafts and exemptions invalidate reminder status.
      # The supporting stale action clears its marker after new PR activity.
      # Reviewer reminder cleanup is paused along with reviewer reminders.
      #
      # This step checks open, event-labeled PRs and removes only reminder labels.
      # It leaves event, next-action, and exemption labels unchanged, sends no
      # comments, and applies removals on scheduled and manual runs.
      - name: Clean up obsolete reminder status
        shell: bash
        run: |
          # Each result contains a PR number whose author marker is obsolete.
          # Paused reviewer cleanup also checked REVIEWER_ACTION_LABEL and
          # REVIEWER_REMINDER_LABEL; it must be restored with reviewer reminders.
          candidates=$(
            gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" |
            jq -r --arg event "$EVENT_LABEL" \
              --arg authorReminder "$AUTHOR_REMINDER_LABEL" \
              --arg exempt "$EXEMPT_LABEL" '
                def has_label($name): .labels | any(.name == $name);
                .[] | select(has_label($event)) |
                select(has_label($authorReminder) and
                  (.draft or has_label($exempt))) |
                .number'
          )
          # Remove only the reminder labels flagged as no longer applicable.
          while read -r pr_number; do
            [[ -z "$pr_number" ]] && continue
            labels_to_remove=(--remove-label "$AUTHOR_REMINDER_LABEL")
            # Reviewer label removal is paused:
            # labels_to_remove+=(--remove-label "$REVIEWER_REMINDER_LABEL")
            gh pr edit "$pr_number" "${labels_to_remove[@]}"
          done <<< "$candidates"

  # 3. Send author reminders through the supporting workflow after cleanup.
  send-author-reminder:
    name: Send author reminders
    needs: [configuration, validate-labels, label-event-prs, manage-pr-reminders]
    if: github.repository == 'MicrosoftDocs/fabric-docs-pr'
    uses: ./.github/workflows/reusable-kp-reminder.yml
    with:
      reminder-type: author
      inactivity-days: ${{ fromJSON(needs.configuration.outputs.inactivity-days) }}
      operations-per-run: ${{ fromJSON(needs.configuration.outputs.operations-per-run) }}
      event-label: ${{ needs.configuration.outputs.event-label }}
      author-action-label: ${{ needs.configuration.outputs.author-action-label }}
      # reviewer-action-label: ${{ needs.configuration.outputs.reviewer-action-label }}
      author-reminder-label: ${{ needs.configuration.outputs.author-reminder-label }}
      # reviewer-reminder-label: ${{ needs.configuration.outputs.reviewer-reminder-label }}
      exempt-label: ${{ needs.configuration.outputs.exempt-label }}

  # 4. Reviewer reminders are paused until next-action ownership is agreed.
  # send-reviewer-reminder:
  #   name: Send reviewer reminders
  #   needs: [configuration, validate-labels, label-event-prs, manage-pr-reminders, send-author-reminder]
  #   uses: ./.github/workflows/reusable-kp-reminder.yml
  #   with:
  #     reminder-type: reviewer
  #     inactivity-days: ${{ fromJSON(needs.configuration.outputs.inactivity-days) }}
  #     operations-per-run: ${{ fromJSON(needs.configuration.outputs.operations-per-run) }}
  #     event-label: ${{ needs.configuration.outputs.event-label }}
  #     author-action-label: ${{ needs.configuration.outputs.author-action-label }}
  #     reviewer-action-label: ${{ needs.configuration.outputs.reviewer-action-label }}
  #     author-reminder-label: ${{ needs.configuration.outputs.author-reminder-label }}
  #     reviewer-reminder-label: ${{ needs.configuration.outputs.reviewer-reminder-label }}
  #     exempt-label: ${{ needs.configuration.outputs.exempt-label }}
