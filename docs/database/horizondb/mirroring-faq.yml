metadata:
  title: Frequently asked questions about Microsoft Fabric HorizonDB mirroring
  description: Answers to common questions about mirroring Fabric HorizonDB data to Microsoft Fabric.
  ms.reviewer: scoriani
  ms.topic: faq
  ms.date: 11/06/2026
